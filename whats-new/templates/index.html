<!doctype html>
<html lang="en" data-resolution="{{resolution}}" data-composition-variables='[{"id":"claim","type":"string","label":"End card line","default":"{{claim}}"}]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width={{width}}, height={{height}}" />
    <title>{{title}}</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
{{font_faces}}
      :root {
{{css_vars}}
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: {{width}}px; height: {{height}}px; overflow: hidden; background: var(--ground); font-family: var(--font-display); }
      #root { position: relative; width: {{width}}px; height: {{height}}px; overflow: hidden; }
      #ground { position: absolute; inset: 0; background: var(--ground); }
      #root > [data-composition-src] { position: absolute; inset: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="{{duration}}" data-width="{{width}}" data-height="{{height}}">
      <div id="ground"></div>

{{scene_hosts}}

{{caption_host}}

{{audio_clips}}
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>

      :root {
        --ground: #0f0f13;
        --ink: #ffffff;
        --accent: #7986cb;
        --mpesa: #2f8f1c;
        --font-display: "Wavvy Montserrat", Montserrat, sans-serif;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--ground); font-family: var(--font-display); }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
      #ground { position: absolute; inset: 0; background: var(--ground); }
      #root > [data-composition-src] { position: absolute; inset: 0; }
    </style>

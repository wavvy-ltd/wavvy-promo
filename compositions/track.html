<template>

    @font-face { font-family: "Wavvy Montserrat"; font-weight: 700; src: url("assets/fonts/Montserrat-Bold.ttf"); }
    #root { position: absolute; inset: 0; background: #0f0f13; font-family: "Wavvy Montserrat", Montserrat, sans-serif; overflow: hidden; }

  <div id="root" data-composition-id="track" data-width="1080" data-height="1920">
    <div id="track-stage" class="clip" data-start="0" data-duration="11" data-layout-allow-overflow>
      <div id="track-cam">
        <div id="track-zoom">
          <div class="phone" id="track-phone">
            <div class="screen">
              <img id="track-empty" src="assets/screens/empty_home.png" alt="Add your first transaction" />

              <div id="track-bar"></div>
              <img id="track-done" src="assets/screens/sync_done.png" alt="52 transactions imported and categorized" />
              <img id="track-txns" src="assets/screens/transactions.png" alt="Transactions list with categories" />

            </div>
          </div>
        </div>

      <div id="track-sms"><div class="from">MPESA · TK5D5E6F7G</div><div class="body">You have received Ksh6,500.00 from PETER OTIENO.</div></div>
    </div>
  </div>
  <script>
    const tl = gsap.timeline({ paused: true });
    gsap.set("#track-import", { opacity: 0 });
    gsap.set("#track-done", { opacity: 0, scale: 1.06, transformOrigin: "50% 30%" });
    gsap.set("#track-home", { opacity: 0, y: 120 });
    gsap.set("#track-txns", { opacity: 0, y: 260 });
    // a real M-Pesa SMS arrives from the top edge, holds so it can be read…
    tl.fromTo("#track-sms", { y: -420, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "expo.out" }, 0.3);
    // …and drops into the phone
    tl.to("#track-sms", { y: 760, scale: 0.12, opacity: 0, transformOrigin: "50% 50%", duration: 0.45, ease: "power3.in" }, 2.2);
    // the app starts organising: the progress bar fills
    tl.to("#track-import", { opacity: 1, duration: 0.18, ease: "power2.out" }, 2.6);
    tl.set("#track-empty", { opacity: 0 }, 2.9);
    tl.fromTo("#track-bar", { width: 0, opacity: 1 }, { width: 660, duration: 1.6, ease: "power1.inOut" }, 2.7);
    // "All done": 52 transactions imported & categorized — held long enough to read
    tl.to("#track-import", { opacity: 0, duration: 0.1 }, 4.4);
    tl.to("#track-bar", { opacity: 0, duration: 0.05 }, 4.4);
    tl.to("#track-done", { opacity: 1, scale: 1, duration: 0.25, ease: "expo.out" }, 4.4);
    // "…categorized in seconds": scroll to the transactions, each with its category chip
    tl.to("#track-done", { y: -260, opacity: 0, duration: 0.45, ease: "power2.inOut" }, 6.5);
    tl.to("#track-txns", { y: 0, opacity: 1, duration: 0.45, ease: "power2.inOut" }, 6.5);
    tl.fromTo("#track-cam", { scale: 1, x: 0, y: 0, transformOrigin: "50% 50%" }, { scale: 1.45, x: 0, y: -120, duration: 0.6, ease: "power2.inOut" }, 7.1);
    // the home screen with everything tracked
    tl.to("#track-cam", { scale: 1, x: 0, y: 0, duration: 0.45, ease: "power2.inOut" }, 9.0);
    tl.to("#track-txns", { opacity: 0, duration: 0.1 }, 9.2);
    tl.to("#track-home", { opacity: 1, y: 0, duration: 0.3, ease: "expo.out" }, 9.2);
    // punch in on the insights row and the nav bar
    tl.to("#track-cam", { scale: 1.45, x: 0, y: -220, duration: 0.5, ease: "power2.inOut" }, 9.7);
    // zoom through the Insights tab icon: its fill becomes the next scene
    tl.fromTo("#track-zoom", { scale: 1, transformOrigin: "41% 89%" }, { scale: 3.4, duration: 0.5, ease: "power3.in" }, 10.5);
    // the real M-Pesa SMS card (top) must be gone before the zoom
    tl.set("#track-sms", { opacity: 0 }, 3.0);
    window.__timelines["track"] = tl;
  </script>

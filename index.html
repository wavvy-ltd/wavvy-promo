<!doctype html>
<html
  lang="en"
  data-resolution="portrait"
  data-composition-variables='[
    {"id":"claim","type":"string","label":"End card line","default":"Know where your money is going"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Wavvy Wallet — 60s promo</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Wavvy Montserrat"; font-weight: 500; src: url("assets/fonts/Montserrat-Medium.ttf"); }
      @font-face { font-family: "Wavvy Montserrat"; font-weight: 600; src: url("assets/fonts/Montserrat-SemiBold.ttf"); }
      @font-face { font-family: "Wavvy Montserrat"; font-weight: 700; src: url("assets/fonts/Montserrat-Bold.ttf"); }
      @font-face { font-family: "Wavvy Montserrat"; font-weight: 800; src: url("assets/fonts/Montserrat-ExtraBold.ttf"); }
      @font-face { font-family: "Wavvy Montserrat"; font-weight: 900; src: url("assets/fonts/Montserrat-Black.ttf"); }
      :root {
        --ground: #0f0f13;
        --ink: #ffffff;
        --accent: #7986cb;
        --mpesa: #2f8f1c;
        --font-display: "Wavvy Montserrat", Montserrat, sans-serif;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--ground); font-family: var(--font-display); }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
      #ground { position: absolute; inset: 0; background: var(--ground); }
      #root > [data-composition-src] { position: absolute; inset: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="60" data-width="1080" data-height="1920">
      <div id="ground"></div>

      <div id="hook" data-composition-id="hook" data-composition-src="compositions/hook.html" data-track-kind="graphics" data-start="0" data-duration="4" data-track-index="1" data-width="1080" data-height="1920" style="z-index: 1"></div>
      <div id="reveal" data-composition-id="reveal" data-composition-src="compositions/reveal.html" data-track-kind="graphics" data-start="4" data-duration="5" data-track-index="1" data-width="1080" data-height="1920" style="z-index: 2"></div>
      <div id="track" data-composition-id="track" data-composition-src="compositions/track.html" data-track-kind="graphics" data-start="9" data-duration="11" data-track-index="1" data-width="1080" data-height="1920" style="z-index: 3"></div>
      <div id="insights" data-composition-id="insights" data-composition-src="compositions/insights.html" data-track-kind="graphics" data-start="20" data-duration="11" data-track-index="1" data-width="1080" data-height="1920" style="z-index: 4"></div>
      <div id="budgets" data-composition-id="budgets" data-composition-src="compositions/budgets.html" data-track-kind="graphics" data-start="30.8" data-duration="10.4" data-track-index="2" data-width="1080" data-height="1920" style="z-index: 5"></div>
      <div id="chat" data-composition-id="chat" data-composition-src="compositions/chat.html" data-track-kind="graphics" data-start="41" data-duration="11.2" data-track-index="1" data-width="1080" data-height="1920" style="z-index: 6"></div>
      <div id="endcard" data-composition-id="endcard" data-composition-src="compositions/endcard.html" data-track-kind="graphics" data-start="51.6" data-duration="8.4" data-track-index="2" data-width="1080" data-height="1920" style="z-index: 7"></div>

      <div id="captions" data-composition-id="captions" data-composition-src="compositions/captions.html" data-track-kind="captions" data-start="9" data-duration="42.6" data-track-index="3" data-width="1080" data-height="1920" style="z-index: 9"></div>

      <audio id="music" class="clip" src="assets/audio/music60.wav" data-start="0" data-duration="60" data-volume="0.5" data-fade-in="0.5" data-fade-out="2" data-track-index="4"></audio>
      <audio id="vo1" class="clip" src="assets/audio/vo_01.wav" data-start="0.15" data-duration="3.39" data-volume="2.2" data-track-index="5"></audio>
      <audio id="vo2" class="clip" src="assets/audio/vo_02.wav" data-start="4.2" data-duration="1.23" data-volume="2.2" data-track-index="5"></audio>
      <audio id="vo3" class="clip" src="assets/audio/vo_03.wav" data-start="9.3" data-duration="5.16" data-volume="2.2" data-track-index="5"></audio>
      <audio id="vo4" class="clip" src="assets/audio/vo_04.wav" data-start="20.5" data-duration="3.0" data-volume="2.2" data-track-index="5"></audio>
      <audio id="vo5" class="clip" src="assets/audio/vo_05.wav" data-start="31.3" data-duration="3.84" data-volume="2.2" data-track-index="5"></audio>
      <audio id="vo6" class="clip" src="assets/audio/vo_06.wav" data-start="41.5" data-duration="3.43" data-volume="2.2" data-track-index="5"></audio>
      <audio id="vo7" class="clip" src="assets/audio/vo_07.wav" data-start="52.3" data-duration="7.38" data-volume="2.2" data-track-index="5"></audio>
      <audio id="vo8" class="clip" src="assets/audio/vo_08.wav" data-start="5.9" data-duration="2.19" data-volume="2.2" data-track-index="6"></audio>
      <audio id="vo9" class="clip" src="assets/audio/vo_09.wav" data-start="14.9" data-duration="3.75" data-volume="2.2" data-track-index="6"></audio>
      <audio id="vo10" class="clip" src="assets/audio/vo_10.wav" data-start="24.2" data-duration="4.16" data-volume="2.2" data-track-index="6"></audio>
      <audio id="vo11" class="clip" src="assets/audio/vo_11.wav" data-start="36.0" data-duration="3.05" data-volume="2.2" data-track-index="6"></audio>
      <audio id="vo12" class="clip" src="assets/audio/vo_12.wav" data-start="46.0" data-duration="4.33" data-volume="2.2" data-track-index="6"></audio>    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
